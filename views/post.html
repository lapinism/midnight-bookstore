<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>심야책방 - 게시글</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <script defer src="/js/post.js"></script>
</head>

<body>
    <header>
        <a href="/">
            <h1>심야책방</h1>
            <p>영업시간 21:00 ~ 06:00</p>
        </a>
        <a class="button" href="/write">글쓰기</a>
    </header>

    <main>
        <article class="panel">
            <div class="post-header" style="margin-bottom: 1rem;">
                <div>
                    <h1 id="post-title">불러오는 중...</h1>
                    <p>
                        <span id="post-meta" class="quiet"></span>
                        <a id="edit-link" class="button" href="#">수정</a>
                        <a id="delete-post-link" class="danger" href="#">삭제</a>
                    </p>
                </div>
            </div>
            <p id="post-content" class="post-content"></p>
        </article>

        <ul style="border-bottom: 1px solid var(--second); border-top: 1px solid var(--second);"></ul>

        <form id="comment-form" class="comment-form">
            <input id="comment-content" class="comment-content" type="text" maxlength="1000" placeholder="댓글" required>
            <input id="comment-password" class="comment-password" type="password" minlength="4" maxlength="100" placeholder="비밀번호" required>
            <button type="submit" class="button">작성</button>
        </form>
    </main>
</body>

</html>
