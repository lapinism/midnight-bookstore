<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>심야책방 - 글 수정</title>
    <link rel="stylesheet" href="/css/style.css">
    <script defer src="/js/edit.js"></script>
</head>

<body>
    <header>
        <a href="/">
            <h1>심야책방</h1>
            <p>영업시간 21:00 ~ 06:00</p>
        </a>
        <a class="button" href="/write">글쓰기</a>
    </header>

    <main>
        <h1>글 수정</h1>

        <form id="edit-form" class="stack-form">
            <input id="title" class="strong" type="text" maxlength="100" placeholder="제목" required>
            <textarea id="content" maxlength="5000" placeholder="본문" required></textarea>
            <p>
                <input id="password" type="password" minlength="4" maxlength="100" placeholder="비밀번호" required>
                <button type="submit" class="button">수정</button>
            </p>
        </form>
    </main>
</body>

</html>
